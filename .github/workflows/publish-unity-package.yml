name: Validate and publish Unity package

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_upm:
        description: Publish to upm after validation (main only)
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check publication target
        if: inputs.publish_upm && github.ref != 'refs/heads/main'
        run: throw 'UPM publication requires running this workflow on main.'

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Resolve package version
        id: package-version
        run: |
          $version = ./scripts/Get-PackageVersion.ps1
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build release binaries
        env:
          BEZORO_PACKAGE_VERSION: ${{ steps.package-version.outputs.version }}
        run: dotnet build bezoro.framework.sln -c Release -p:ContinuousIntegrationBuild=true

      - name: Check public API baseline
        run: ./scripts/Export-PublicApi.ps1 -Check

      - name: Install Stockfish for Linux integration tests
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl -fSL https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-linux-x86-64-universal.tar.gz -o "$RUNNER_TEMP/stockfish.tar.gz"
          echo "9defc0d4e55d49c65a6d042f3e571a39fcea499ade6dbe741b53b8c65e03611f  $RUNNER_TEMP/stockfish.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/stockfish"
          tar -xzf "$RUNNER_TEMP/stockfish.tar.gz" -C "$RUNNER_TEMP/stockfish"
          echo "BEZORO_STOCKFISH_PATH=$RUNNER_TEMP/stockfish/stockfish/stockfish-linux-x86-64-universal" >> "$GITHUB_ENV"

      - name: Run release tests
        run: ./scripts/Test-Framework.ps1 -NoBuild

      - name: Stage validated Unity package
        id: stage
        if: >-
          runner.os == 'Linux' &&
          github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish_upm)
        env:
          BEZORO_PACKAGE_VERSION: ${{ steps.package-version.outputs.version }}
        run: ./scripts/Build-UnityPackage.ps1

      - name: Upload validated Unity package
        if: steps.stage.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: unity-package
          path: artifacts/unity-package/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  publish-unity-package:
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish_upm)
    runs-on: ubuntu-latest
    concurrency:
      group: publish-upm
      queue: max
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download validated Unity package
        uses: actions/download-artifact@v8
        with:
          name: unity-package
          path: artifacts/unity-package/

      - name: Publish validated UPM branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/Publish-UnityPackageBranch.ps1 -PackagePath artifacts/unity-package
